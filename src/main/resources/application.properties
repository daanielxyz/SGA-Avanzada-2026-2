spring.application.name=SGA Avanzada 2026-2

# --- Base de datos PostgreSQL (DEC-11). Credenciales por variables de entorno, nunca en git ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sga}
spring.datasource.username=${DB_USER:sga}
spring.datasource.password=${DB_PASSWORD:}

# --- Esquema: lo crea Flyway (db/migration); Hibernate solo valida que coincida con las entidades JPA ---
spring.flyway.enabled=true
# db/migration es común a todos los motores; db/{vendor} (aquí db/postgresql) agrega el SQL exclusivo del motor (DEC-12)
spring.flyway.locations=classpath:db/migration,classpath:db/{vendor}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Servidor ---
server.port=8080

# --- Reloj del sistema (EST-06): horas del alojamiento en zona horaria de Colombia ---
sga.zona-horaria=America/Bogota

# --- Seguridad (DEC-67). El secreto firma los tokens JWT (mínimo 32 caracteres); sin él se usa uno al azar que
#     cambia en cada arranque, válido solo para desarrollo. El primer administrador se crea al arrancar si no hay
#     ninguno y llegan su correo y su clave; ninguno de estos valores va en git ---
sga.seguridad.jwt.secreto=${SGA_JWT_SECRETO:}
sga.seguridad.jwt.duracion-minutos=${SGA_JWT_DURACION_MINUTOS:60}
sga.seguridad.administrador.nombre=${SGA_ADMIN_NOMBRE:Administrador}
sga.seguridad.administrador.correo=${SGA_ADMIN_CORREO:}
sga.seguridad.administrador.clave=${SGA_ADMIN_CLAVE:}

# --- Claves de los canales externos (CAN-02 · CAN-03 · DEC-73): cada canal guarda solo el nombre de su referencia;
#     el secreto va en una variable de entorno con ese mismo nombre (p. ej. BOOKING_API_KEY=...) o en
#     sga.canales.<referencia>. Nunca en git ---

# --- Valores iniciales del alojamiento (DEC-25 · DEC-53). Solo se usan la primera vez que arranca el despliegue,
#     para crear el alojamiento, su política y su calendario; después el administrador los cambia en la aplicación.
#     Cada hotel del SaaS pone los suyos con variables de entorno ---
sga.inicializar=${SGA_INICIALIZAR:true}
sga.alojamiento.id=${SGA_ALOJAMIENTO_ID:ALO-1}
sga.alojamiento.nombre=${SGA_ALOJAMIENTO_NOMBRE:Puerta al Sol}
sga.alojamiento.descripcion=${SGA_ALOJAMIENTO_DESCRIPCION:Por definir}
sga.alojamiento.ciudad=${SGA_ALOJAMIENTO_CIUDAD:Por definir}
sga.alojamiento.direccion=${SGA_ALOJAMIENTO_DIRECCION:Por definir}
sga.alojamiento.latitud=${SGA_ALOJAMIENTO_LATITUD:0}
sga.alojamiento.longitud=${SGA_ALOJAMIENTO_LONGITUD:0}
sga.alojamiento.normas=${SGA_ALOJAMIENTO_NORMAS:}
sga.alojamiento.medios-pago=EFECTIVO,TRANSFERENCIA,PAGO_EN_LINEA
sga.alojamiento.servicios[0].nombre=Parqueadero
sga.alojamiento.servicios[0].genera-cargo=false
sga.alojamiento.servicios[0].valor=0
sga.alojamiento.temporada-base=Temporada base

# Parámetros de negocio (ALO-03); los mínimos son los de la Ficha del curso (D-05)
sga.parametros.umbral-edad-facturable=12
sga.parametros.hora-entrada=15:00
sga.parametros.hora-salida=11:00
sga.parametros.tiempo-preparacion-horas=3
sga.parametros.plazo-confirmacion-horas=24
sga.parametros.hora-limite-no-show=22:00
sga.parametros.anticipo-pct=30
sga.parametros.minimo-medios-pago=2
sga.parametros.minimo-servicios-adicionales=1
sga.parametros.minimo-temporadas=2
sga.parametros.minimo-tramos-cancelacion=2
sga.parametros.minimo-capacidades-distintas=2
# Pago en línea al reservar desde el portal (DEC-69): ANTICIPO o TOTAL, y los minutos para pagar antes de que venza
sga.parametros.pago-en-linea=ANTICIPO
sga.parametros.plazo-pago-en-linea-minutos=30

# Política de cancelación inicial (DEC-41): gratis hasta 48 h antes de la entrada, luego 50 %; no-show 100 %
sga.politica.tramos[0].antelacion-min-horas=48
sga.politica.tramos[0].penalizacion.base=VALOR_TOTAL
sga.politica.tramos[0].penalizacion.porcentaje=0
sga.politica.tramos[1].antelacion-min-horas=0
sga.politica.tramos[1].penalizacion.base=VALOR_TOTAL
sga.politica.tramos[1].penalizacion.porcentaje=50
sga.politica.no-show.base=VALOR_TOTAL
sga.politica.no-show.porcentaje=100
