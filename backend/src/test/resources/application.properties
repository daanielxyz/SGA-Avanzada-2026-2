spring.application.name=SGA Avanzada 2026-2 (pruebas)

# --- H2 en memoria en modo PostgreSQL (DEC-11) ---
spring.datasource.url=jdbc:h2:mem:sgadb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# @DataJpaTest usa esta misma base en lugar de reemplazarla por una H2 genérica
spring.test.database.replace=none

# --- Las pruebas aplican las mismas migraciones de Flyway y Hibernate valida el esquema:
#     si una entidad JPA no coincide con el SQL, las pruebas fallan ---
spring.flyway.enabled=true
# Solo las migraciones comunes: el EXCLUDE de db/postgresql no existe en H2 (DEC-12)
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Seguridad: secreto fijo de pruebas y sin administrador inicial; cada prueba crea sus usuarios (DEC-67) ---
sga.seguridad.jwt.secreto=secreto-solo-para-las-pruebas-del-sga-0123456789
sga.seguridad.jwt.duracion-minutos=60
sga.seguridad.administrador.nombre=Administrador
sga.seguridad.administrador.correo=
sga.seguridad.administrador.clave=

# --- Clave del canal Booking de las pruebas (DEC-73); solo existe aquí ---
sga.canales.BOOKING_API_KEY=clave-de-prueba-booking

# --- El planificador de vencimientos no corre solo: las pruebas lo llaman a mano (DEC-69) ---
sga.planificador.activo=false

# --- El arranque no crea el alojamiento: cada prueba prepara sus datos (DEC-53). InicializadorAlojamientoTest lo
#     prueba aparte, con los valores reales de src/main y su propia base ---
sga.inicializar=false

# --- Documentación de la API apagada, como en src/main por defecto; DocumentacionApiTest la prende (DEC-79) ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
